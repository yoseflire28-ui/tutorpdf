<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>TutorPDF DOCX Viewer</title>

  <!-- Peer dependency: JSZip (required by docx-preview) -->
  <script src="js/jszip.min.js"></script>
  <!-- docx-preview v0.4.0 — full OOXML rendering engine -->
  <script src="js/docx-preview.min.js"></script>

  <style>
    /* ─────────────────── Reset & Design Tokens ──────────── */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-color: #ffffff;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
      --table-bg: #ffffff;
      --table-header-bg: #f8fafc;
      --accent-color: #E65A4B;
      --scrollbar-track: #F0F0F0;
      --scrollbar-thumb: #BDBDBD;
    }

    /* ── Dark Mode Token Overrides (data-theme attribute) ── */
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #f3f4f6;
      --border-color: #374151;
      --table-bg: #1e1e1e;
      --table-header-bg: #2d3748;
    }

    /* ──────────────── Base Layout ──────────────────────── */
    html, body {
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif !important;
      -webkit-text-size-adjust: 100% !important;
      text-size-adjust: 100% !important;
      overflow-x: hidden !important;
      box-sizing: border-box !important;
      min-height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ─── Safe Viewport Padding: Prevents left-edge text clipping ─── */
    #reader-container {
      width: 100% !important;
      max-width: 100% !important;
      padding: 16px 12px 32px 12px !important;
      box-sizing: border-box !important;
    }

    /* ─── Global Layout & Typography Sanitization ─── */
    #reader-container, .docx-wrapper, .docx, p, div, span {
      width: 100% !important;
      max-width: 100% !important;
      -webkit-hyphens: none !important;
      hyphens: none !important;
      word-break: normal !important;
      overflow-wrap: break-word !important;
    }

    /* ─────────────── Loading / Error States ─────────────── */
    #loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-color);
      opacity: 0.6;
      letter-spacing: 0.3px;
    }

    #error-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 32px;
      text-align: center;
    }

    .error-icon {
      font-size: 56px;
      color: var(--accent-color);
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 8px;
    }

    .error-detail {
      font-size: 13px;
      color: var(--text-color);
      opacity: 0.7;
      max-width: 400px;
      word-break: break-word;
    }

    /* ──────── Text & Heading Flow: Safe word-wrap ────────── */
    p, span, h1, h2, h3, h4, h5, h6 {
      max-width: 100% !important;
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
      white-space: normal !important;
      word-break: normal !important;
      box-sizing: border-box !important;
    }

    /* Image protection */
    img {
      max-width: 100% !important;
      height: auto !important;
    }

    /* ── Table Architecture: Native display model + scroll wrapper ── */

    /* Scroll wrapper injected by JS around every <table> */
    .table-wrapper {
      width: 100% !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      margin: 16px 0 !important;
      border-radius: 6px !important;
      border: 1px solid var(--border-color) !important;
      box-sizing: border-box !important;
    }

    /* CRITICAL: Keep native table display model — do NOT set display:block */
    table {
      display: table !important;
      width: 100% !important;
      min-width: 0 !important;
      border-collapse: collapse !important;
      background-color: var(--table-bg) !important;
      table-layout: auto !important;
      box-sizing: border-box !important;
    }

    tbody, thead, tfoot {
      display: table-row-group !important;
    }

    thead {
      display: table-header-group !important;
    }

    tr {
      display: table-row !important;
    }

    th, td {
      display: table-cell !important;
      padding: 10px 12px !important;
      border: 1px solid var(--border-color) !important;
      vertical-align: top !important;
      font-size: 14px !important;
      line-height: 1.5 !important;
      white-space: normal !important;
      word-break: normal !important;
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
      box-sizing: border-box !important;
    }

    th {
      background-color: var(--table-header-bg) !important;
      font-weight: 600 !important;
    }

    /* ── Dark Mode: Override inline black text injected by docx-preview ── */
    /*
     * docx-preview emits elements like <span style="color:#000000">
     * which wins over class-based rules. We use !important on color here
     * scoped to the dark-theme attribute so light mode is untouched.
     */
    [data-theme="dark"] #reader-container p,
    [data-theme="dark"] #reader-container span,
    [data-theme="dark"] #reader-container div,
    [data-theme="dark"] #reader-container li,
    [data-theme="dark"] #reader-container h1,
    [data-theme="dark"] #reader-container h2,
    [data-theme="dark"] #reader-container h3,
    [data-theme="dark"] #reader-container h4,
    [data-theme="dark"] #reader-container h5,
    [data-theme="dark"] #reader-container h6 {
      color: var(--text-color) !important;
    }

    [data-theme="dark"] #reader-container td,
    [data-theme="dark"] #reader-container th {
      color: var(--text-color) !important;
      border-color: var(--border-color) !important;
    }

    [data-theme="dark"] .table-wrapper {
      border-color: var(--border-color) !important;
    }

    /* ──────────────── Custom Scrollbar ──────────────────── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-color);
    }
  </style>
</head>
<body>

  <!-- Loading indicator (visible until document renders) -->
  <div id="loading-state">
    <div class="spinner"></div>
    <div class="loading-text">Rendering document…</div>
  </div>

  <!-- Error state (hidden by default) -->
  <div id="error-state">
    <div class="error-icon">⚠</div>
    <div class="error-title">Failed to Render Document</div>
    <div class="error-detail" id="error-detail"></div>
  </div>

  <!-- docx-preview renders reflowed HTML here -->
  <div id="reader-container"></div>

  <script>
    // Define immediately on global window object
    window.sanitizeBullets = function() {
      try {
        const container = document.getElementById('reader-container');
        if (!container) return;

        const nodes = container.querySelectorAll('span, p, li, td');
        nodes.forEach(function(node) {
          if (node.textContent) {
            // Replace unrendered bullet codes and private-use symbols with clean UTF-8 bullets
            node.textContent = node.textContent.replace(/[\uF000-\uF0FF]/g, '• ');
          }
        });
        console.log("Bullets successfully sanitized.");
      } catch (e) {
        console.warn("sanitizeBullets error suppressed:", e);
      }
    };

    const renderOptions = {
      inWrapper: false,
      ignoreWidth: true,
      ignoreHeight: true,
      ignorePageMargins: true,
      breakPages: false,
      experimental: true,
      useBase64URL: true,
      renderChanges: false
    };

    var _documentRendered = false;

    function _showLoading() {
      document.getElementById('loading-state').style.display = 'flex';
      document.getElementById('error-state').style.display = 'none';
      document.getElementById('reader-container').style.display = 'none';
    }

    function _showError(message) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'flex';
      document.getElementById('error-detail').textContent = message || 'Unknown error';
      document.getElementById('reader-container').style.display = 'none';
    }

    function _showDocument() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'none';
      document.getElementById('reader-container').style.display = 'block';
    }

    function _notifyFlutter(payload) {
      try {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('FlutterChannel', JSON.stringify(payload));
        }
      } catch (e) {}
    }

    /**
     * wrapTablesWithScrollContainers
     * Wraps every <table> in a .table-wrapper <div> so wide tables
     * scroll horizontally instead of overflowing or collapsing.
     * Must run AFTER docx-preview has rendered.
     */
    function wrapTablesWithScrollContainers() {
      const container = document.getElementById('reader-container');
      if (!container) return;

      const tables = container.querySelectorAll('table:not(.table-wrapper table)');
      tables.forEach(function(table) {
        // Skip if already wrapped
        if (table.parentElement && table.parentElement.classList.contains('table-wrapper')) return;

        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);

        // Strip pixel-fixed widths that prevent fluid layout
        table.style.width = '';
        table.removeAttribute('width');
        const cells = table.querySelectorAll('td, th, col, colgroup');
        cells.forEach(function(cell) {
          cell.removeAttribute('width');
          // Only clear inline pixel widths; leave percentage/auto alone
          if (cell.style.width && cell.style.width.indexOf('px') !== -1) {
            cell.style.width = '';
          }
        });
      });

      console.log('Table scroll wrappers applied.');
    }

    /**
     * sanitizeDocumentLayout
     * Strips Word-generated inline pixel margins that push content
     * off-screen. Does NOT strip padding (which breaks safe-area).
     * Does NOT touch table cells (width managed by wrapTablesWithScrollContainers).
     */
    function sanitizeDocumentLayout() {
      const container = document.getElementById('reader-container');
      if (!container) return;

      // Only target block-level text containers, not table cells
      const blockEls = container.querySelectorAll(
        'p, div:not(.table-wrapper), section, article, .docx, .docx-wrapper'
      );

      blockEls.forEach(function(el) {
        // Strip large pixel margin-lefts from Word indentation
        var mLeft = parseFloat(el.style.marginLeft);
        if (!isNaN(mLeft) && mLeft > 40) {
          el.style.marginLeft = '0px';
        }
        var mRight = parseFloat(el.style.marginRight);
        if (!isNaN(mRight) && mRight > 40) {
          el.style.marginRight = '0px';
        }
        // Clamp max-width; do NOT zero-out padding (left safe area must survive)
        el.style.maxWidth = '100%';

        // Remove legacy HTML width attributes
        if (el.hasAttribute('width')) el.removeAttribute('width');
      });

      console.log('Document layout sanitized.');
    }

        // Clamp max-width; do NOT zero-out padding (left safe area must survive)
        el.style.maxWidth = '100%';

        // Remove legacy HTML width attributes
        if (el.hasAttribute('width')) el.removeAttribute('width');
      });

      console.log('Document layout sanitized.');
    }

    function loadDocxFromBase64(base64Data) {
      _showLoading();

      try {
        var binaryString = atob(base64Data);
        var len = binaryString.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        var arrayBuffer = bytes.buffer;

        var container = document.getElementById('reader-container');
        container.innerHTML = '';

        docx.renderAsync(arrayBuffer, container, null, renderOptions)
          .then(function(result) {
            _documentRendered = true;
            _showDocument();
            wrapTablesWithScrollContainers();
            sanitizeDocumentLayout();
            window.sanitizeBullets();
            _notifyFlutter({
              type: 'docxRendered',
              success: true,
              pageCount: 1
            });
          })
          .catch(function(err) {
            var errMsg = err && err.message ? err.message : String(err);
            _showError(errMsg);
            _notifyFlutter({
              type: 'docxError',
              error: errMsg
            });
          });
      } catch (e) {
        var errMsg = e && e.message ? e.message : String(e);
        _showError('Base64 decode error: ' + errMsg);
        _notifyFlutter({
          type: 'docxError',
          error: 'Base64 decode error: ' + errMsg
        });
      }
    }

    /**
     * setDarkMode
     * Uses data-theme attribute on <html> so CSS variable cascade
     * overrides docx-preview inline styles (color:#000000).
     * Also sets body background immediately for smooth transitions.
     */
    function setDarkMode(isDark) {
      var root = document.documentElement;
      if (isDark) {
        root.setAttribute('data-theme', 'dark');
        document.body.style.backgroundColor = '#121212';
      } else {
        root.removeAttribute('data-theme');
        document.body.style.backgroundColor = '';
      }
    }

    function goToPage(pageNumber) {
      window.scrollTo({ behavior: 'smooth', top: 0 });
    }

    function goToSlideExternal(pageNumber) {
      goToPage(pageNumber);
    }
  </script>
</body>
</html>
